name: Bug report
description: Something isn't working right.
body:
  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting checklist
      description: Complete these checks before opening an issue.
      options:
        - label: I am using Visual Studio Code 1.127 or newer.
          required: true
        - label: I am using the latest Ollama for VS Code extension.
          required: true
        - label: I restarted Visual Studio Code and Ollama and confirmed the issue still occurs.
          required: true
        - label: 'I ran `Ollama: Diagnose Models` and checked the Ollama output channel.'
          required: false
  - type: textarea
    id: description
    attributes:
      label: What is the issue?
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the shortest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy relevant output from the Ollama output channel and Ollama server logs.
      render: shell
    validations:
      required: false
  - type: input
    id: vscode-version
    attributes:
      label: Visual Studio Code version
      description: Copy the version from Help > About.
      placeholder: e.g., 1.127.0
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Ollama for VS Code extension version
      description: Copy the version from the Extensions view.
      placeholder: e.g., 0.0.7
    validations:
      required: true
  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      description: Run `ollama --version`.
      placeholder: e.g., 0.17.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      description: Which operating system are you using?
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - WSL2
        - Other
    validations:
      required: true
